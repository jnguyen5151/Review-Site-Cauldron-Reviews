<article class="review">
  <section *ngIf="review() as review">
    <h4 class="review-warning">⚠️ This page is currently WORK IN PROGRESS ⚠️</h4>
    <h2 class="review-header"> {{review.title}}</h2>
    <p class="review-author">written by {{review.authorName}} on {{review.createdAt | date:'MMMM d, yyyy'}}</p>
    <div class="review-content ql-editor" [innerHTML]="safeContent()"></div>
    <p class="score"> Rating: {{review.rating}}/100 </p>
  </section>
</article>
